services:
  db:
    image: postgres
    restart: always
    user: postgres

    secrets:
      - db-password

    volumes:
      - db-data:/var/lib/postgresql

    environment:
      POSTGRES_DB: example
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password

    expose:
      - "5432"

    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: diplomarbeit.azurecr.io/backend-server:latest
    env_file:
      - webapp.env
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui
    ports:
      - "8001:8080"
    volumes:
      - ./swagger.yaml:/tmp/swagger.yaml:ro
    environment:
      SWAGGER_JSON: /tmp/swagger.yaml

volumes:
  db-data:

secrets:
  db-password:
    file: db/password.txt
