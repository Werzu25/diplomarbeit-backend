services:
  db:
    image: postgres
    restart: unless-stopped
    user: postgres

    secrets:
      - db-password

    volumes:
      - db-data:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: example
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password

    expose:
      - "5432"

    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - webapp.env
    ports:
      - "80:80"
    volumes:
      - images-data:/app/images
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  images-data:

secrets:
  db-password:
    file: db/password.txt
